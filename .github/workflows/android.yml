name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      - name: Ajouter l'identifiant d'appli AdMob de test
        run: |
          sed -i 's|</application>|<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/></application>|' android/app/src/main/AndroidManifest.xml

      - name: Synchroniser le jeu avec Android
        run: npx cap sync android

      - name: Construire l'APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: cozy-clutter-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
